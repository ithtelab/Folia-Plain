services:
  gateway:
    image: folia-plain-local/web:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/gateway.Dockerfile
      args:
        VCS_REF: ${FOLIA_BUILD_VCS_REF:-local}
        STACK_VERSION: ${FOLIA_STACK_VERSION:-local}
        GITHUB_REPOSITORY: ithtelab/Folia-Plain

  backend:
    image: folia-plain-local/web-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/backend.Dockerfile

  netease-api:
    image: folia-plain-local/netease-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/netease-api.Dockerfile

  kugou-api:
    image: folia-plain-local/kugou-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/kugou-api.Dockerfile

  qq-api:
    image: folia-plain-local/qq-api:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/qq-api.Dockerfile

  sync-server:
    image: folia-plain-local/sync-server:check
    build:
      context: ../..
      dockerfile: deploy/docker/images/sync-server.Dockerfile
